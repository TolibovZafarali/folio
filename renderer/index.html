<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Folio Reader</title>
</head>
<body>
  <header class="app-header">
    <button id="shelf-toggle" class="icon-button" title="Show bookshelf" aria-label="Show bookshelf" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM9 4v16"/></svg></button>
    <div class="app-brand"><strong>folio<span>.</span></strong><small>READER</small></div>
    <div class="header-actions"><button id="check-updates" class="icon-button" aria-label="Check for updates" title="Check for updates"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg><span class="update-dot" hidden></span></button><button id="pin" class="icon-button" title="Keep on top" aria-label="Keep on top" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 7 3 3v2H6v-2l3-3-1-7ZM12 15v6"/></svg></button><button id="import" class="import-button"><span aria-hidden="true">+</span> Open PDF</button></div>
  </header>
  <div id="notice" class="notice" role="status" hidden><span id="notice-text"></span><button id="dismiss-notice" aria-label="Dismiss notification">×</button></div>
  <div id="update-banner" class="update-banner" hidden><p id="update-message" role="status" aria-live="polite"></p><button id="update-action" class="update-action" hidden>Update and restart</button><button id="dismiss-update" class="icon-button" aria-label="Dismiss update message">×</button></div>
  <div class="app-body">
    <aside id="shelf" class="shelf" aria-label="Bookshelf" hidden><div class="shelf-header"><h2>Your bookshelf</h2><button id="close-shelf" class="icon-button" aria-label="Close bookshelf">×</button></div><p class="shelf-hint">Saved on this computer</p><div id="books"></div><p id="empty-shelf">Your PDFs will appear here.</p><p class="app-version">Folio Reader <span id="app-version"></span></p></aside>
    <main id="main">
      <section id="welcome" class="welcome">
        <div class="empty-book" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M10 8h22a5 5 0 0 1 5 5v27H14a4 4 0 0 1-4-4V8Zm0 27a4 4 0 0 1 4-4h23M17 15h12M17 21h9"/></svg></div>
        <p class="eyebrow">A LITTLE SPACE TO READ</p><h1>Pick up a good book.</h1><p>Open a PDF and make yourself at home.<br>We’ll keep your book and your place.</p><button id="welcome-import" class="primary">Open a PDF <span aria-hidden="true">↗</span></button><span class="welcome-note">Offline. Just you and your next page.</span>
      </section>
      <section id="reader" class="reader" aria-label="PDF reader" hidden>
        <div class="document-heading"><div><h1 id="book-title"></h1><p id="book-subtitle">PDF document</p></div><button id="remove" class="icon-button" title="Remove book" aria-label="Remove book"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button></div>
        <div class="toolbar">
          <div class="pagination"><button id="previous" class="icon-button" aria-label="Previous page">‹</button><label class="sr-only" for="page">Page</label><input id="page" type="number" min="1" value="1" aria-label="Page"><span id="total">/ —</span><button id="next" class="icon-button" aria-label="Next page">›</button></div>
          <div class="view-switch" role="group" aria-label="View mode"><button id="text-view" aria-pressed="true">Text</button><button id="pdf-view" aria-pressed="false">PDF</button></div>
          <div class="zoom"><button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button><button id="zoom-reset" title="Reset zoom">100%</button><button id="zoom-in" class="icon-button" aria-label="Zoom in">+</button></div>
        </div>
        <div id="viewport" class="viewport"><p id="loading" class="loading" role="status"></p><button id="retry" class="primary" hidden>Try again</button><article id="text-page" class="text-page" hidden><div id="page-caption" class="page-caption"></div><div id="text-content"></div></article><div id="pdf-page" class="pdf-page" hidden><canvas id="canvas" aria-label="PDF page"></canvas></div></div>
        <footer class="reader-footer"><span id="save-status">Opening document…</span><progress id="progress" max="100" value="0" aria-label="Reading progress"></progress><span id="percentage">0%</span></footer>
      </section>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
