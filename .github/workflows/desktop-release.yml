name: Windows reader release

on:
  push:
    tags:
      - 'reader-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example reader-v1.1.2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-reader-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate release tag
        id: release
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^reader-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Use a stable reader-vX.Y.Z release tag.'
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Check package version and updater destination
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          if ($env:RELEASE_TAG -cne "reader-v$version") {
            throw "Tag $env:RELEASE_TAG does not match package.json version $version."
          }
          $publish = @($package.build.publish) | Where-Object { $_.provider -eq 'github' }
          if (@($publish).Count -ne 1 -or "$($publish.owner)/$($publish.repo)" -ine $env:RELEASE_REPOSITORY) {
            throw 'Configure package.json build.publish.owner/repo for this repository before releasing.'
          }
          if ($publish.tagNamePrefix -cne 'reader-v') {
            throw 'Configure the updater tagNamePrefix as reader-v to match this workflow.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Test library, updater, and release integrity
        working-directory: .
        run: npm test

      - name: Test desktop import and restart persistence
        working-directory: .
        run: npm run test:app

      - name: Build Windows installer and update metadata
        working-directory: .
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build

      - name: Test installed Windows app and retained library
        working-directory: .
        run: npm run test:installed

      - name: Verify installer, update manifest, and artifact checksums
        working-directory: .
        run: node scripts/verify-update.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-reader
          path: |
            release/Folio-Reader-Setup-*-x64.exe
            release/Folio-Reader-Setup-*-x64.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish downloadable application
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-reader
          path: release

      - name: Verify downloaded release artifacts
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          A small PDF reader for Windows 10/11 (64-bit), with in-app updates.

          Download `Folio-Reader-Setup-<version>-x64.exe` and run it. The per-user installer requires no administrator access. Import your own PDFs, resize the window, and enable Always on top when needed. Imported books and reading positions are saved locally and restored when you reopen the app.

          Version 1.1.2 moves reading tools into the bookshelf panel, places Previous and Next page below the book content, and adds Modern sans, Classic serif, Book serif, and Monospace choices for Text view. Your font choice is remembered after restart.

          If you have version 1.1.1 from `TolibovZafarali/any-to-pdf`, install this version manually once to switch to this repository's update feed. Your books and reading progress are preserved. The previous installation cannot discover this release through its old feed.

          If you used portable version 1.0.0, close it and install this version once. It opens the same local library from `%APPDATA%\Folio Reader\`; your books and saved pages are retained. Future versions can be downloaded and installed from the app's update controls. Installing updates or uninstalling the app retains this library data.

          The application is unsigned. Windows may display a publisher or SmartScreen prompt; check that you downloaded it from this repository's release. `SHA256SUMS.txt` includes checksums for the installer, its blockmap, and `latest.yml`. The updater verifies the installer's SHA-512 against the release manifest before installation.

          Books and reading history stay on your computer. Reading works offline; checking for and downloading updates connects to GitHub. The `.blockmap` and `latest.yml` assets are used by the updater and do not need to be opened manually.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-draft.txt 2>/dev/null; then
            if [ "$(cat release-draft.txt)" != "true" ]; then
              echo 'Refusing to replace an already published release.' >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --verify-tag \
              --title "Folio Reader $APP_VERSION for Windows" \
              --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" \
            "release/Folio-Reader-Setup-$APP_VERSION-x64.exe" \
            "release/Folio-Reader-Setup-$APP_VERSION-x64.exe.blockmap" \
            release/latest.yml \
            release/SHA256SUMS.txt \
            --clobber
          # A draft keeps the updater feed unchanged until every artifact is uploaded.
          gh release edit "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft=false \
            --latest
